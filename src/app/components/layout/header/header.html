<header class="header">
  <div class="header-top">
    <a routerLink="/" class="logo">
      🌼 BH<span>Shop</span>
    </a>
    <a routerLink="/cart" class="cart" aria-label="Giỏ hàng">
      🛒
      @if (cartCount() > 0) {
        <span class="cart-badge">{{ cartCount() }}</span>
      }
    </a>
  </div>

  <form class="search" (submit)="$event.preventDefault(); onSearch()">
    <input
      type="search"
      [(ngModel)]="searchTerm"
      name="search"
      placeholder="Tìm bó hoa bạn yêu thích (Nhấn Enter)..."
    />
  </form>
</header>

<nav class="nav">
  <a
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }">
    Trang chủ
  </a>

  <a
    routerLink="/products"
    routerLinkActive="active">
    Sản phẩm
  </a>

  <a
    routerLink="/bai_viet"
    routerLinkActive="active">
    Bài viết
  </a>

  <a
    routerLink="/cart"
    routerLinkActive="active">
    Giỏ hàng
  </a>
</nav>
